<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cathay Hackathon 2026 Team E507 开发工作区"
    />
    <title>Team E507 · Cathay Hackathon 2026</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header>
        <a class="wordmark" href="/" aria-label="Team E507 首页"
          >E507<span> / </span>BUILD</a
        >
        <span class="event">CATHAY HACKATHON 2026</span>
      </header>
      <main>
        <p class="eyebrow">TEAM WORKSPACE · 01</p>
        <h1>从一个想法，<br />到一次完整的演示。</h1>
        <p class="intro">
          欢迎来到 Team E507
          的开发工作区。模板已就绪，让我们一起完成第一个可运行的产品场景。
        </p>
        <div class="actions">
          <button id="health-check" type="button">
            检查开发环境 <span aria-hidden="true">↗</span>
          </button>
          <a
            class="repo-link"
            href="https://github.com/shentonyan/Cathay-Hackathon-2026-TeamE507"
            >打开团队仓库 →</a
          >
        </div>
        <p id="health-status" class="status" role="status" aria-live="polite">
          启动后，检查本地预览服务是否可用。
        </p>
        <section class="steps" aria-label="下一步">
          <article>
            <span class="number">01 / DISCOVER</span>
            <h2>确定核心问题</h2>
            <p>选定一个用户场景，写出具体的验收标准。</p>
          </article>
          <article>
            <span class="number">02 / BUILD</span>
            <h2>跑通完整流程</h2>
            <p>从页面到接口，完成最小可演示闭环。</p>
          </article>
          <article>
            <span class="number">03 / DEMO</span>
            <h2>让结果可复现</h2>
            <p>准备样例数据、演示脚本与备用方案。</p>
          </article>
        </section>
      </main>
      <footer>
        <span>TEAM E507</span><span>开发占位页 · 业务功能待实现</span>
      </footer>
    </div>
  </body>
</html>
