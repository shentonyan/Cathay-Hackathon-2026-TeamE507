name: Task / 开发任务
description: 记录开发与交付任务 / Track development and delivery work
title: '[Task] '
body:
  - type: textarea
    id: outcome
    attributes:
      label: 目标与交付物 / Goal and deliverable
      description: 完成什么，交付在哪个模块？ / What should be delivered, and in which module?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收与验证 / Acceptance and validation
      description: 提供验收清单与验证步骤。 / Provide criteria and verification steps.
    validations:
      required: true
  - type: textarea
    id: owner
    attributes:
      label: 负责人和依赖 / Owner and dependencies
      description: 设置负责人，说明依赖和交接。 / Set an assignee and explain dependencies and handoff.
